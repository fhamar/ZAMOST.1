<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>FHAMAR ZAMOST | Login</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:15px;

    color:white;

    background:
    radial-gradient(
        circle at 20% 10%,
        #24415f 0%,
        transparent 35%
    ),

    radial-gradient(
        circle at 90% 90%,
        #182d43 0%,
        transparent 35%
    ),

    linear-gradient(
        135deg,
        #02060b,
        #07111d,
        #0b1928
    );

    overflow:auto;
}


/* =====================================
   LOGIN CARD
===================================== */

.login-container{

    width:100%;
    max-width:430px;

    padding:40px 32px;

    background:
    linear-gradient(
        145deg,
        rgba(16,32,49,.97),
        rgba(5,12,20,.98)
    );

    border:1px solid #40566d;

    border-radius:26px;

    box-shadow:
    0 30px 90px rgba(0,0,0,.7),
    inset 0 1px 0 rgba(255,255,255,.05);

    backdrop-filter:blur(15px);

    animation:cardIn .7s ease;
}


@keyframes cardIn{

    from{
        opacity:0;
        transform:translateY(25px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}


/* =====================================
   LOGO
===================================== */

.logo{

    width:78px;
    height:78px;

    margin:auto;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:22px;

    border:1px solid #91a5b9;

    background:
    linear-gradient(
        145deg,
        #182d43,
        #070e16
    );

    box-shadow:
    0 0 35px rgba(154,174,195,.12);

    font-size:27px;

    font-weight:900;

    letter-spacing:2px;

    color:#4da3ff;
}


/* =====================================
   BRAND
===================================== */

.brand{

    text-align:center;

    margin-top:20px;

    font-size:24px;

    font-weight:900;

    letter-spacing:3px;

    color:#4da3ff;
}


.brand span{
    color:#aeb9c5;
}


.tagline{

    text-align:center;

    margin-top:8px;

    color:#708398;

    font-size:10px;

    letter-spacing:3px;
}


/* =====================================
   WELCOME
===================================== */

.welcome{

    margin-top:34px;

    text-align:center;
}


.welcome h1{

    font-size:30px;

    font-weight:800;

    color:#edf3f8;
}


.welcome p{

    margin-top:9px;

    color:#8294a8;

    font-size:13px;

    line-height:1.6;
}


/* =====================================
   LOGIN TABS
===================================== */

.login-tabs{

    margin-top:24px;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:5px;

    padding:5px;

    border:1px solid #293f55;

    border-radius:11px;

    background:#050c14;
}


.tab{

    height:38px;

    border:none;

    border-radius:7px;

    background:transparent;

    color:#71869c;

    font-size:9px;

    font-weight:bold;

    transition:.2s;
}


.tab:hover{

    color:#dce5ed;

}


.tab.active{

    background:#173b5b;

    color:#4da3ff;

}


/* =====================================
   FORM
===================================== */

form{

    margin-top:22px;
}


.input-group{

    margin-bottom:17px;
}


label{

    display:block;

    margin-bottom:8px;

    color:#aebdcb;

    font-size:11px;

    font-weight:600;
}


.input-box{

    position:relative;
}


.input-icon{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#8296aa;

    font-size:15px;
}


input{

    width:100%;

    height:52px;

    padding:0 15px 0 44px;

    border-radius:12px;

    border:1px solid #34495e;

    outline:none;

    background:#07111c;

    color:white;

    font-size:13px;

    transition:.25s;
}


input::placeholder{

    color:#586b7e;
}


input:focus{

    border-color:#4da3ff;

    box-shadow:
    0 0 0 3px rgba(77,163,255,.08);
}


/* =====================================
   PASSWORD
===================================== */

.password-input{

    padding-right:55px;
}


.show-password{

    position:absolute;

    right:14px;

    top:50%;

    transform:translateY(-50%);

    border:none;

    background:none;

    color:#8093a7;

    font-size:10px;

    font-weight:bold;
}


.password-rule{

    margin-top:7px;

    color:#62768b;

    font-size:8px;
}


.password-rule span{

    color:#4da3ff;

}


/* =====================================
   FORGOT
===================================== */

.forgot-row{

    display:flex;

    justify-content:flex-end;

    margin-top:-5px;

    margin-bottom:18px;
}


.forgot{

    color:#aebdcb;

    font-size:10px;

    cursor:pointer;
}


.forgot:hover{

    color:white;

}


/* =====================================
   MAIN BUTTON
===================================== */

.login-button{

    width:100%;

    height:53px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(
        135deg,
        #4da3ff,
        #aebdca
    );

    color:#07111c;

    font-size:12px;

    font-weight:900;

    letter-spacing:1.5px;

    transition:.25s;
}


.login-button:hover{

    transform:translateY(-2px);

    background:#ffffff;
}


.login-button:disabled{

    opacity:.55;

    cursor:not-allowed;

    transform:none;
}


/* =====================================
   PHONE
===================================== */

.phone-row{

    display:grid;

    grid-template-columns:90px 1fr;

    gap:8px;
}


.country-code{

    height:52px;

    border-radius:12px;

    border:1px solid #34495e;

    background:#07111c;

    color:#cbd7e2;

    padding:0 8px;

    outline:none;

    font-size:12px;
}


.phone-input{

    padding-left:15px;
}


/* =====================================
   OTP
===================================== */

.otp-area{

    display:none;

    margin-top:15px;
}


.otp-button{

    width:100%;

    height:48px;

    margin-top:5px;

    border-radius:10px;

    border:1px solid #40566c;

    background:#0b1724;

    color:#dbe4ed;

    font-size:10px;

    font-weight:bold;
}


.otp-button:hover{

    border-color:#4da3ff;

    color:#4da3ff;
}


/* =====================================
   GOOGLE
===================================== */

.google-section{

    display:none;

    margin-top:22px;
}


.google-button{

    width:100%;

    height:53px;

    border-radius:12px;

    border:1px solid #40566c;

    background:#0b1724;

    color:#dbe4ed;

    cursor:pointer;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:12px;

    font-size:12px;

    font-weight:700;

    transition:.25s;
}


.google-button:hover{

    background:#102235;

    border-color:#71869b;

    transform:translateY(-1px);
}


.google-icon{

    width:21px;

    height:21px;

    border-radius:50%;

    background:white;

    color:#4285F4;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:13px;

    font-weight:bold;
}


/* =====================================
   REGISTER
===================================== */

.register{

    text-align:center;

    margin-top:23px;

    color:#72859a;

    font-size:11px;
}


.register a{

    color:#d8e2ec;

    text-decoration:none;

    font-weight:bold;

    margin-left:5px;
}


.register a:hover{

    text-decoration:underline;

}


/* =====================================
   MESSAGE
===================================== */

.message{

    display:none;

    margin-top:15px;

    padding:11px;

    border-radius:9px;

    font-size:9px;

    line-height:1.5;

    text-align:center;
}


.message.show{

    display:block;

}


.message.error{

    background:rgba(150,60,60,.10);

    border:1px solid #744c4c;

    color:#ffb1b1;
}


.message.success{

    background:rgba(70,130,180,.10);

    border:1px solid #466982;

    color:#9ed0ff;
}


/* =====================================
   SECURITY
===================================== */

.security{

    margin-top:22px;

    padding:12px;

    border-radius:10px;

    background:rgba(120,145,170,.05);

    border:1px solid #1f3448;

    text-align:center;

    color:#71869c;

    font-size:9px;

    line-height:1.5;
}


/* =====================================
   MOBILE
===================================== */

@media(max-width:480px){

    body{
        padding:10px;
    }

    .login-container{

        padding:32px 20px;

        border-radius:22px;

    }

    .brand{

        font-size:21px;

    }

    .welcome h1{

        font-size:27px;

    }

    .phone-row{

        grid-template-columns:
        82px 1fr;

    }

}

</style>

</head>


<body>


<div class="login-container">


    <!-- LOGO -->

    <div class="logo">
        FZ
    </div>


    <!-- BRAND -->

    <div class="brand">

        FHAMAR<span>.ZAMOST</span>

    </div>


    <div class="tagline">
        PREMIUM DIGITAL PORTAL
    </div>


    <!-- WELCOME -->

    <div class="welcome">

        <h1>
            Welcome Back
        </h1>

        <p>
            Sign in securely to your FHAMAR ZAMOST portal.
        </p>

    </div>


    <!-- =================================
         TABS
    ================================== -->

    <div class="login-tabs">


        <button
        class="tab active"
        id="emailTab"
        onclick="showMode('email')">

            EMAIL

        </button>


        <button
        class="tab"
        id="phoneTab"
        onclick="showMode('phone')">

            MOBILE OTP

        </button>


        <button
        class="tab"
        id="googleTab"
        onclick="showMode('google')">

            GOOGLE

        </button>


    </div>


    <!-- =================================
         EMAIL LOGIN
    ================================== -->

    <form
    id="emailForm"
    onsubmit="emailLogin(event)">


        <div class="input-group">

            <label>
                EMAIL ADDRESS
            </label>


            <div class="input-box">

                <span class="input-icon">
                    ✉
                </span>


                <input
                id="email"
                type="email"
                autocomplete="email"
                placeholder="Enter your email"
                required>

            </div>

        </div>



        <div class="input-group">

            <label>
                PASSWORD
            </label>


            <div class="input-box">

                <span class="input-icon">
                    ●
                </span>


                <input
                id="password"
                class="password-input"
                type="password"
                autocomplete="current-password"
                minlength="6"
                placeholder="Minimum 6 characters"
                required>


                <button
                type="button"
                class="show-password"
                onclick="togglePassword()">

                    SHOW

                </button>

            </div>


            <div class="password-rule">

                Minimum
                <span>6 characters</span>

            </div>

        </div>



        <div class="forgot-row">

            <a
            class="forgot"
            onclick="forgotPassword()">

                Forgot Password?

            </a>

        </div>



        <button
        id="emailLoginButton"
        type="submit"
        class="login-button">

            SIGN IN

        </button>


    </form>


    <!-- =================================
         PHONE LOGIN
    ================================== -->

    <div
    id="phoneSection"
    style="display:none;">


        <div class="input-group">

            <label>
                MOBILE NUMBER
            </label>


            <div class="phone-row">


                <select
                id="countryCode"
                class="country-code">

                    <option value="+91">
                        +91
                    </option>

                </select>


                <input
                id="phoneNumber"
                class="phone-input"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                placeholder="10 digit mobile">

            </div>

        </div>


        <button
        id="sendOtpButton"
        class="otp-button"
        onclick="sendOTP()">

            SEND OTP

        </button>


        <div
        id="otpArea"
        class="otp-area">


            <div class="input-group">

                <label>
                    ENTER OTP
                </label>


                <input
                id="otpCode"
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="Enter 6 digit OTP">

            </div>


            <button
            id="verifyOtpButton"
            class="login-button"
            onclick="verifyOTP()">

                VERIFY OTP & CONTINUE

            </button>


        </div>


        <!-- Firebase reCAPTCHA -->

        <div id="recaptcha-container"></div>


    </div>


    <!-- =================================
         GOOGLE LOGIN
    ================================== -->

    <div
    id="googleSection"
    class="google-section">


        <button
        type="button"
        id="googleButton"
        class="google-button"
        onclick="googleLogin()">


            <span class="google-icon">
                G
            </span>


            Continue with Google


        </button>


    </div>


    <!-- REGISTER -->

    <div class="register">

        Don't have an account?


        <a href="register.html">
            Create Account
        </a>

    </div>


    <!-- MESSAGE -->

    <div
    id="message"
    class="message">
    </div>


    <!-- SECURITY -->

    <div class="security">

        🔒 Secure Login

        <br>

        Your account is protected by
        Firebase Authentication.

    </div>


</div>



<!-- =========================================
     FIREBASE
========================================= -->

<script type="module">


/* =========================================
   FIREBASE SDK
========================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    signInWithRedirect,
    RecaptchaVerifier,
    signInWithPhoneNumber,
    sendPasswordResetEmail,
    getRedirectResult
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyDpyBWCS7hquXoKcEfGSYDFi7epMNHTTTg",

    authDomain:
    "zamost1.firebaseapp.com",

    projectId:
    "zamost1",

    storageBucket:
    "zamost1.firebasestorage.app",

    messagingSenderId:
    "660391979595",

    appId:
    "1:660391979595:web:62389051f81c388505fbce",

    measurementId:
    "G-PTVR032GDP"

};



/* =========================================
   INITIALIZE
========================================= */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const googleProvider =
    new GoogleAuthProvider();


googleProvider.setCustomParameters({

    prompt:"select_account"

});



/* =========================================
   VARIABLES
========================================= */

let confirmationResult =
    null;

let recaptchaVerifier =
    null;



/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    type="error"
){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message show " + type;

}



/* =========================================
   FIREBASE ERROR
========================================= */

function firebaseError(error){

    const code =
        error?.code || "";


    const errors = {

        "auth/invalid-credential":
        "Email or password is incorrect.",

        "auth/invalid-login-credentials":
        "Email or password is incorrect.",

        "auth/user-not-found":
        "No account found with this email.",

        "auth/wrong-password":
        "Incorrect password.",

        "auth/invalid-email":
        "Please enter a valid email address.",

        "auth/too-many-requests":
        "Too many attempts. Please try again later.",

        "auth/popup-closed-by-user":
        "Google Login was cancelled.",

        "auth/popup-blocked":
        "Google popup was blocked.",

        "auth/network-request-failed":
        "Network problem. Check your internet connection.",

        "auth/operation-not-allowed":
        "This login method is not enabled in Firebase.",

        "auth/invalid-phone-number":
        "Please enter a valid mobile number.",

        "auth/quota-exceeded":
        "SMS limit has been reached. Please try again later.",

        "auth/code-expired":
        "OTP expired. Please request a new OTP.",

        "auth/invalid-verification-code":
        "Invalid OTP. Please check the code."

    };


    return errors[code]
        ||
        "Something went wrong. Please try again.";

}



/* =========================================
   HOME
========================================= */

function goHome(){

    window.location.href =
        "home.html";

}



/* =========================================
   EMAIL LOGIN
========================================= */

window.emailLogin =
async function(event){

    event.preventDefault();


    const email =
        document.getElementById(
            "email"
        )
        .value
        .trim();


    const password =
        document.getElementById(
            "password"
        )
        .value;


    if(password.length < 6){

        showMessage(
            "Password must contain at least 6 characters."
        );

        return;

    }


    const button =
        document.getElementById(
            "emailLoginButton"
        );


    button.disabled =
        true;


    button.textContent =
        "SIGNING IN...";


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        showMessage(
            "Login successful. Opening Home...",
            "success"
        );


        setTimeout(
            goHome,
            600
        );


    }

    catch(error){

        console.error(error);

        showMessage(
            firebaseError(error)
        );

    }

    finally{

        button.disabled =
            false;

        button.textContent =
            "SIGN IN";

    }

};



/* =========================================
   GOOGLE LOGIN
========================================= */

window.googleLogin =
async function(){

    const button =
        document.getElementById(
            "googleButton"
        );


    button.disabled =
        true;


    button.innerHTML =
        "Opening Google...";


    try{

        /*
        Mobile/browser friendly:
        redirect flow
        */

        await signInWithRedirect(
            auth,
            googleProvider
        );

    }

    catch(error){

        console.error(error);

        button.disabled =
            false;

        button.innerHTML =
        `
        <span class="google-icon">G</span>
        Continue with Google
        `;


        showMessage(
            firebaseError(error)
        );

    }

};
