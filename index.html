<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FHAMAR ZAMOST | Login</title>

<style>
:root{
    --bg:#070b13;--card:#0e1623;--card2:#111c2b;--border:#202d40;
    --blue:#3182f6;--blue2:#60a5fa;--silver:#c2cad5;--muted:#8e9bad;--white:#f5f7fb;--text-main:#dbe4ef;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    color:var(--white);
    background:radial-gradient(circle at 50% -10%,#13223a 0,var(--bg) 42%);
    overflow:auto;
}

.login-container{
    width:100%;
    max-width:430px;
    padding:40px 32px;
    background:linear-gradient(
        145deg,
        rgba(16,32,49,.97),
        rgba(5,12,20,.98)
    );
    border:1px solid var(--border);
    border-radius:26px;
    box-shadow:
        0 30px 90px rgba(0,0,0,.7),
        inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(15px);
    animation:cardIn .7s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(25px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.logo{
    width:78px;
    height:78px;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:22px;
    border:1px solid #34445a;
    background:linear-gradient(145deg,#17263b,#0b111b);
    box-shadow:0 0 35px rgba(49,130,246,.15);
    font-size:27px;
    font-weight:900;
    letter-spacing:2px;
    color:var(--white);
}

.brand{
    text-align:center;
    margin-top:20px;
    font-size:24px;
    font-weight:900;
    letter-spacing:3px;
    color:var(--blue);
}

.brand span{
    color:var(--silver);
}

.tagline{
    text-align:center;
    margin-top:8px;
    color:var(--muted);
    font-size:10px;
    letter-spacing:3px;
}

.welcome{
    margin-top:34px;
    text-align:center;
}

.welcome h1{
    font-size:30px;
    font-weight:800;
    color:var(--white);
}

.welcome p{
    margin-top:9px;
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
}

.login-tabs{
    margin-top:24px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
    padding:5px;
    border:1px solid var(--border);
    border-radius:11px;
    background:#050c14;
}

.tab{
    height:38px;
    border:none;
    border-radius:7px;
    background:transparent;
    color:var(--muted);
    font-size:9px;
    font-weight:bold;
    cursor:pointer;
}

.tab.active{
    background:#173b5b;
    color:var(--blue2);
}

form{
    margin-top:22px;
}

.input-group{
    margin-bottom:17px;
}

label{
    display:block;
    margin-bottom:8px;
    color:var(--text-main);
    font-size:11px;
    font-weight:600;
}

.input-box{
    position:relative;
}

.input-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
    font-size:15px;
    pointer-events:none;
}

input{
    width:100%;
    height:52px;
    padding:0 15px 0 44px;
    border-radius:12px;
    border:1px solid var(--border);
    outline:none;
    background:#07111c;
    color:white;
    font-size:13px;
}

input::placeholder{
    color:#586b7e;
}

input:focus{
    border-color:var(--blue2);
    box-shadow:0 0 0 3px rgba(96,165,250,.08);
}

.password-input{
    padding-right:60px;
}

.password-eye{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    width:45px;
    height:38px;
    border:0;
    border-radius:8px;
    background:transparent;
    cursor:pointer;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.password-eye:hover{
    background:#102235;
}

.password-rule{
    margin-top:7px;
    color:var(--muted);
    font-size:9px;
}

.password-rule span{
    color:var(--blue2);
}

.forgot-row{
    display:flex;
    justify-content:flex-end;
    margin-top:-5px;
    margin-bottom:18px;
}

.forgot{
    color:var(--text-main);
    font-size:10px;
    cursor:pointer;
    text-decoration:none;
}

.forgot:hover{
    color:var(--blue2);
}

.login-button{
    width:100%;
    height:53px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,var(--blue),var(--silver));
    color:#07111c;
    font-size:12px;
    font-weight:900;
    letter-spacing:1.5px;
    cursor:pointer;
}

.login-button:disabled,
.otp-button:disabled,
.google-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.phone-section,
.google-section{
    display:none;
    margin-top:22px;
}

.phone-row{
    display:grid;
    grid-template-columns:90px 1fr;
    gap:8px;
}

.country-code{
    height:52px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#07111c;
    color:var(--text-main);
    padding:0 8px;
    outline:none;
}

.phone-input{
    padding:0 15px;
}

.otp-area{
    display:none;
    margin-top:15px;
}

.otp-button{
    width:100%;
    height:48px;
    border-radius:10px;
    border:1px solid #40566c;
    background:#0b1724;
    color:var(--text-main);
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
}

.google-button{
    width:100%;
    height:53px;
    border-radius:12px;
    border:1px solid #40566c;
    background:#0b1724;
    color:var(--text-main);
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    font-size:12px;
    font-weight:700;
}

.google-icon{
    width:21px;
    height:21px;
    border-radius:50%;
    background:white;
    color:#4285F4;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:bold;
}

.register{
    text-align:center;
    margin-top:23px;
    color:var(--muted);
    font-size:11px;
}

.register a{
    color:var(--text-main);
    text-decoration:none;
    font-weight:bold;
    margin-left:5px;
}

.message{
    display:none;
    margin-top:15px;
    padding:11px;
    border-radius:9px;
    font-size:10px;
    line-height:1.5;
    text-align:center;
}

.message.success{
    display:block;
    background:#0b2a20;
    border:1px solid #2d735c;
    color:#8ee0c1;
}

.message.error{
    display:block;
    background:#301516;
    border:1px solid #704040;
    color:#ffb0b0;
}

#recaptcha-container{
    margin-top:15px;
    display:flex;
    justify-content:center;
    overflow:hidden;
}

.firebase-status{
    margin-top:22px;
    padding:12px;
    border-radius:10px;
    background:rgba(49,130,246,.05);
    border:1px solid #1f3448;
    text-align:center;
    color:var(--muted);
    font-size:9px;
    line-height:1.5;
}

@media(max-width:480px){

    body{
        padding:10px;
    }

    .login-container{
        padding:32px 20px;
        border-radius:22px;
    }

    .brand{
        font-size:21px;
    }

    .welcome h1{
        font-size:27px;
    }

    .phone-row{
        grid-template-columns:82px 1fr;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">FZ</div>

    <div class="brand">
        FHAMAR<span>.ZAMOST</span>
    </div>

    <div class="tagline">
        PREMIUM DIGITAL PORTAL
    </div>

    <div class="welcome">
        <h1>Welcome Back</h1>
        <p>
            Sign in securely to your FHAMAR ZAMOST portal.
        </p>
    </div>

    <div class="login-tabs">

        <button
            type="button"
            class="tab active"
            id="emailTab">
            EMAIL
        </button>

        <button
            type="button"
            class="tab"
            id="phoneTab">
            MOBILE OTP
        </button>

        <button
            type="button"
            class="tab"
            id="googleTab">
            GOOGLE
        </button>

    </div>


    <!-- EMAIL LOGIN -->

    <form id="emailForm">

        <div class="input-group">

            <label>EMAIL ADDRESS</label>

            <div class="input-box">

                <span class="input-icon">✉</span>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

        </div>


        <div class="input-group">

            <label>PASSWORD</label>

            <div class="input-box">

                <span class="input-icon">●</span>

                <input
                    id="password"
                    class="password-input"
                    type="password"
                    autocomplete="current-password"
                    minlength="6"
                    maxlength="6"
                    placeholder="Enter 6 character password"
                    required
                >

                <button
                    type="button"
                    id="passwordEye"
                    class="password-eye">
                    🙈
                </button>

            </div>

            <div class="password-rule">
                Password must be exactly
                <span>6 characters</span>.
            </div>

        </div>


        <div class="forgot-row">

            <a
                class="forgot"
                href="javascript:void(0)"
                id="forgotPassword">
                Forgot Password?
            </a>

        </div>


        <button
            id="emailLoginButton"
            type="submit"
            class="login-button">
            SIGN IN
        </button>

    </form>


    <!-- MOBILE OTP -->

    <div
        id="phoneSection"
        class="phone-section">

        <div class="input-group">

            <label>MOBILE NUMBER</label>

            <div class="phone-row">

                <select
                    id="countryCode"
                    class="country-code">

                    <option value="+91">
                        +91
                    </option>

                </select>

                <input
                    id="phoneNumber"
                    class="phone-input"
                    type="tel"
                    inputmode="numeric"
                    maxlength="10"
                    placeholder="10 digit mobile"
                >

            </div>

        </div>


        <button
            id="sendOtpButton"
            type="button"
            class="otp-button">
            SEND OTP
        </button>


        <div id="recaptcha-container"></div>


        <div
            id="otpArea"
            class="otp-area">

            <div class="input-group">

                <label>ENTER OTP</label>

                <input
                    id="otpCode"
                    type="text"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="Enter 6 digit OTP"
                >

            </div>


            <button
                id="verifyOtpButton"
                type="button"
                class="login-button">
                VERIFY OTP & CONTINUE
            </button>

        </div>

    </div>


    <!-- GOOGLE -->

    <div
        id="googleSection"
        class="google-section">

        <button
            type="button"
            id="googleButton"
            class="google-button">

            <span class="google-icon">
                G
            </span>

            Continue with Google

        </button>

    </div>


    <div class="register">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <div class="firebase-status">

        🔐 Firebase Authentication Connected

        <br>

        Email • Mobile OTP • Google

    </div>

</div>


<script type="module">

/*
===========================================================
FHAMAR.ZAMOST
REAL FIREBASE AUTHENTICATION
===========================================================

firebase-config.js उसी folder में होना चाहिए।
===========================================================
*/

import { app }
from "./firebase-config.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    GoogleAuthProvider,
    signInWithPopup,
    RecaptchaVerifier,
    signInWithPhoneNumber
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/*
===========================================================
FIREBASE AUTH
===========================================================
*/

const auth = getAuth(app);

auth.languageCode = "en";


/*
===========================================================
GOOGLE
===========================================================
*/

const googleProvider =
    new GoogleAuthProvider();


/*
===========================================================
PHONE OTP VARIABLES
===========================================================
*/

let confirmationResult = null;

let recaptchaVerifier = null;


/*
===========================================================
SHORT ELEMENT FUNCTION
===========================================================
*/

const $ = (id) =>
    document.getElementById(id);


/*
===========================================================
MESSAGE
===========================================================
*/

function showMessage(
    text,
    type = "success"
){

    const box = $("message");

    box.textContent = text;

    box.className =
        "message " + type;

}


/*
===========================================================
FIREBASE ERROR
===========================================================
*/

function firebaseError(error){

    const code =
        error?.code || "";

    const errors = {

        "auth/invalid-email":
            "Please enter a valid email address.",

        "auth/user-not-found":
            "No account was found with this email.",

        "auth/wrong-password":
            "Incorrect password.",

        "auth/invalid-credential":
            "Email or password is incorrect.",

        "auth/user-disabled":
            "This account has been disabled.",

        "auth/too-many-requests":
            "Too many attempts. Please try again later.",

        "auth/network-request-failed":
            "Network error. Please check your internet connection.",

        "auth/unauthorized-domain":
            "This website domain is not authorized in Firebase.",

        "auth/operation-not-allowed":
            "This sign-in method is not enabled in Firebase.",

        "auth/invalid-phone-number":
            "Please enter a valid mobile number.",

        "auth/invalid-verification-code":
            "The OTP is incorrect.",

        "auth/code-expired":
            "The OTP has expired. Please request a new OTP.",

        "auth/quota-exceeded":
            "Firebase verification limit has been reached. Please try later.",

        "auth/missing-phone-number":
            "Please enter your mobile number.",

        "auth/captcha-check-failed":
            "reCAPTCHA verification failed. Please try again.",

        "auth/popup-blocked":
            "Popup was blocked by the browser. Please allow popups and try again.",

        "auth/popup-closed-by-user":
            "Google sign-in was closed before completing."

    };

    return errors[code] ||
        "Authentication failed. Please try again.";
}


/*
===========================================================
GO HOME
===========================================================
*/

function goHome(){

    window.location.href =
        "home.html";

}


/*
===========================================================
TAB SWITCH
===========================================================
*/

function switchTab(mode){

    const emailForm =
        $("emailForm");

    const phone =
        $("phoneSection");

    const google =
        $("googleSection");


    emailForm.style.display =
        "none";

    phone.style.display =
        "none";

    google.style.display =
        "none";


    $("emailTab")
        .classList
        .remove("active");

    $("phoneTab")
        .classList
        .remove("active");

    $("googleTab")
        .classList
        .remove("active");


    $("message").className =
        "message";


    if(mode === "email"){

        emailForm.style.display =
            "block";

        $("emailTab")
            .classList
            .add("active");

    }


    if(mode === "phone"){

        phone.style.display =
            "block";

        $("phoneTab")
            .classList
            .add("active");

    }


    if(mode === "google"){

        google.style.display =
            "block";

        $("googleTab")
            .classList
            .add("active");

    }

}


/*
===========================================================
TAB BUTTONS
===========================================================
*/

$("emailTab").onclick =
    () => switchTab("email");

$("phoneTab").onclick =
    () => switchTab("phone");

$("googleTab").onclick =
    () => switchTab("google");


/*
===========================================================
PASSWORD SHOW / HIDE
===========================================================
*/

$("passwordEye").onclick =
    function(){

        const password =
            $("password");


        if(
            password.type ===
            "password"
        ){

            password.type =
                "text";

            this.textContent =
                "👁️";

        }else{

            password.type =
                "password";

            this.textContent =
                "🙈";

        }

    };


/*
===========================================================
EMAIL LOGIN
===========================================================
*/

$("emailForm").addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            $("email")
                .value
                .trim();


        const password =
            $("password")
                .value;


        if(password.length !== 6){

            showMessage(
                "Password must be exactly 6 characters.",
                "error"
            );

            return;

        }


        const button =
            $("emailLoginButton");


        button.disabled = true;

        button.textContent =
            "SIGNING IN...";


        try{

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            console.log(
                "Firebase Email Login:",
                result.user.uid
            );


            showMessage(
                "Login successful. Opening Home...",
                "success"
            );


            setTimeout(
                goHome,
                700
            );


        }catch(error){

            console.error(error);


            showMessage(
                firebaseError(error),
                "error"
            );


            button.disabled =
                false;

            button.textContent =
                "SIGN IN";

        }

    }
);


/*
===========================================================
FORGOT PASSWORD
===========================================================
*/

$("forgotPassword").onclick =
    async function(){

        const email =
            $("email")
                .value
                .trim();


        if(!email){

            showMessage(
                "Please enter your email first.",
                "error"
            );

            return;

        }


        try{

            await sendPasswordResetEmail(
                auth,
                email
            );


            showMessage(
                "Password reset email has been sent. Please check your inbox.",
                "success"
            );


        }catch(error){

            console.error(error);


            showMessage(
                firebaseError(error),
                "error"
            );

        }

    };


/*
===========================================================
CREATE reCAPTCHA
===========================================================
*/

function createRecaptcha(){

    if(recaptchaVerifier){

        return recaptchaVerifier;

    }

    recaptchaVerifier =
        new RecaptchaVerifier(
            auth,
            "recaptcha-container",
            {

                size:"normal",

                callback:function(){

                    console.log(
                        "reCAPTCHA completed."
                    );

                },

                "expired-callback":
                    function(){

                        showMessage(
                            "reCAPTCHA expired. Please verify again.",
                            "error"
                        );

                    }

            }
        );

    return recaptchaVerifier;

}


/*
===========================================================
SEND REAL OTP
===========================================================
*/

$("sendOtpButton").onclick =
    async function(){

        const phone =
            $("phoneNumber")
                .value
                .replace(/\D/g,"");


        if(phone.length !== 10){

            showMessage(
                "Please enter a valid 10 digit mobile number.",
                "error"
            );

            return;

        }


        const country =
            $("countryCode")
                .value;


        const fullPhone =
            country + phone;


        const button =
            $("sendOtpButton");


        button.disabled =
            true;

        button.textContent =
            "SENDING OTP...";


        try{

            const verifier =
                createRecaptcha();


            confirmationResult =
                await signInWithPhoneNumber(
                    auth,
                    fullPhone,
                    verifier
                );


            $("otpArea")
                .style
                .display =
                "block";


            showMessage(
                "OTP has been sent to your mobile number.",
                "success"
            );


            button.textContent =
                "OTP SENT";


        }catch(error){

            console.error(error);


            showMessage(
                firebaseError(error),
                "error"
            );


            button.disabled =
                false;

            button.textContent =
                "SEND OTP";

        }

    };


/*
===========================================================
VERIFY OTP
===========================================================
*/

$("verifyOtpButton").onclick =
    async function(){

        if(!confirmationResult){

            showMessage(
                "Please request an OTP first.",
                "error"
            );

            return;

        }


        const otp =
            $("otpCode")
                .value
                .replace(/\D/g,"");


        if(otp.length !== 6){

            showMessage(
                "Please enter the 6 digit OTP.",
                "error"
            );

            return;

        }


        const button =
            $("verifyOtpButton");


        button.disabled =
            true;

        button.textContent =
            "VERIFYING...";


        try{

            const result =
                await confirmationResult
                    .confirm(otp);


            console.log(
                "Firebase Phone Login:",
                result.user.uid
            );


            showMessage(
                "Mobile verified successfully. Opening Home...",
                "success"
            );


            setTimeout(
                goHome,
                700
            );


        }catch(error){

            console.error(error);


            showMessage(
                firebaseError(error),
                "error"
            );


            button.disabled =
                false;

            button.textContent =
                "VERIFY OTP & CONTINUE";

        }

    };


/*
===========================================================
GOOGLE LOGIN (POPUP METHOD — more reliable on mobile browsers
than redirect, and gives result immediately without needing
a separate getRedirectResult check on page load)
===========================================================
*/

$("googleButton").onclick =
    async function(){

        const button = this;

        button.disabled = true;
        button.innerHTML = "Opening Google...";

        try{

            const result =
                await signInWithPopup(
                    auth,
                    googleProvider
                );

            if(result && result.user){

                console.log(
                    "Firebase Google Login:",
                    result.user.uid
                );

                showMessage(
                    "Google login successful. Opening Home...",
                    "success"
                );

                setTimeout(
                    goHome,
                    700
                );

            }

        }catch(error){

            console.error(
                "Google Login:",
                error
            );

            button.disabled = false;
            button.innerHTML =
                '<span class="google-icon">G</span> Continue with Google';

            showMessage(
                firebaseError(error),
                "error"
            );

        }

    };


/*
===========================================================
MOBILE NUMBER
===========================================================
*/

$("phoneNumber").addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,10);

    }
);


/*
===========================================================
OTP NUMBER
===========================================================
*/

$("otpCode").addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,6);

    }
);

</script>

</body>
</html>
